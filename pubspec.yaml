name: povesti_romanesti
description: "Povești și legende românești - patrimoniu cultural pentru toată familia"
publish_to: 'none'
version: 2.3.7+15

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.4
  flutter_tts: ^4.2.0
  google_mobile_ads: ^5.3.0
  in_app_purchase: ^3.2.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#3A1F86"
  adaptive_icon_foreground: "assets/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/illustrations/
