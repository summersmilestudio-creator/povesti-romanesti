<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1024px;
  height: 1024px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(145deg, #FFF8F0 0%, #F5E6D3 50%, #E8D5C0 100%);
  overflow: hidden;
  font-family: 'Segoe UI', sans-serif;
}
.container {
  text-align: center;
  position: relative;
}
.book {
  font-size: 320px;
  filter: drop-shadow(0 20px 40px rgba(74, 55, 40, 0.3));
  position: relative;
  z-index: 2;
}
.stars {
  position: absolute;
  width: 100%;
  height: 100%;
  top: -80px;
  left: 0;
  z-index: 1;
}
.star {
  position: absolute;
  font-size: 80px;
  animation: twinkle 2s infinite alternate;
}
.star:nth-child(1) { top: 10%; left: 15%; font-size: 70px; animation-delay: 0s; }
.star:nth-child(2) { top: 5%; right: 15%; font-size: 90px; animation-delay: 0.5s; }
.star:nth-child(3) { top: 25%; left: 5%; font-size: 55px; animation-delay: 1s; }
.star:nth-child(4) { top: 20%; right: 5%; font-size: 60px; animation-delay: 1.5s; }
.star:nth-child(5) { top: 0%; left: 45%; font-size: 50px; animation-delay: 0.3s; }
.sparkle1 { position: absolute; bottom: 15%; left: 10%; font-size: 60px; z-index: 1; }
.sparkle2 { position: absolute; bottom: 20%; right: 10%; font-size: 50px; z-index: 1; }
.moon { position: absolute; top: -5%; right: 10%; font-size: 100px; z-index: 0; opacity: 0.7; }
@keyframes twinkle {
  from { opacity: 0.5; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1.1); }
}
</style>
</head>
<body>
<div class="container">
  <div class="stars">
    <span class="star">⭐</span>
    <span class="star">✨</span>
    <span class="star">⭐</span>
    <span class="star">✨</span>
    <span class="star">🌟</span>
  </div>
  <div class="moon">🌙</div>
  <div class="book">📖</div>
  <div class="sparkle1">✨</div>
  <div class="sparkle2">🌟</div>
</div>
</body>
</html>
